<!DOCTYPE html>
<html lang="en" class="bg-gray-100 text-gray-800">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub User Search</title>
    <link rel="stylesheet" href="/GitHub-User-Finder/src/output.css" />
  </head>
  <body class="bg-[#030712] min-h-screen flex items-center justify-center">
    <div
      class="bg-[#1C2839] w-full max-w-xl px-6 py-10 text-[#fff] shadow-xl rounded-lg"
    >
      <!-- Title -->
      <h1 class="text-3xl font-semibold text-center text-[#fff] mb-6">
        GitHub User Search
      </h1>

      <!-- Search Form -->
      <form  class="flex items-center gap-3">
        <input id="user-input"
          type="text"
          name="username"
          placeholder="Enter GitHub username"
          required
          class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <button id="search-btn"
          type="submit"
          class="px-6 py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition-colors cursor-pointer"
        >
          Search
        </button>
      </form>

      <!-- Result Placeholder -->
      <div class="mt-10 animate-pulse">
        <div
          class="bg-[#1C2839] border border-gray-200 rounded-lg p-6 shadow-sm flex items-start space-x-6"
        >
          <!-- Left Side Image -->
          <img id="user-image"
            src="https://avatars.githubusercontent.com/u/9919?v=4"
            alt="User Avatar"
            class="w-24 h-24 rounded-full border border-white object-cover"
          />

          <!-- Right Side Content -->
          <div class="text-[#fff] space-y-2">
            <h2 id="user-username" class="text-2xl font-bold">GitHub</h2>
            <p id="user-fullname" class="text-sm text-gray-300">
              The official GitHub organization
            </p>

            <div class="text-sm space-y-1">
              <p><span class="font-semibold">Followers:</span> <span id="followers-count"> 10000</span></p>
              <p><span class="font-semibold">Repositories:</span> <span id="repo-count"> 200</span></p>
              <p>
                <span class="font-semibold">Location:</span> <span id="location"> Delhi, India</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/GitHub-User-Finder/JS/app.js"></script>
  </body>
</html>
